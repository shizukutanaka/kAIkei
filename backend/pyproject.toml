[tool.ruff]
# CI と開発コンテナは 3.11、本番イメージは 3.12。ruff を 3.12 に向けると
# PEP 695 の型引数構文（3.12以降）を推奨してしまい、3.11 のCIで SyntaxError
# になる。サポート下限に合わせる。
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "E501",
    # UP042: `(str, Enum)` を `StrEnum` にすると **挙動が変わる**。
    # `(str, Enum)` の str() は "Role.ADMIN"、StrEnum の str() は "admin" を返すため、
    # ログ出力・シリアライズ・比較の結果が変化する。Role/Permission は認可判定に
    # 使われるため、様式上の理由で置き換えない。
    "UP042",
    # N818: MfaReauthRequired は制御フロー用の公開例外で、認証コードから送出・捕捉される。
    # 末尾を Error に改名しても得るものが無く、変更範囲だけが広がるため維持する。
    "N818",
    # SIM102/SIM105: 既存コードの様式上の指摘。条件の入れ子は可読性のため、
    # try/except/pass は例外を握り潰す意図を明示するため現状を維持する。
    "SIM102",
    "SIM105",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are intentionally used as call-in-default.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
    "app.core.deps.require_permission",
    "require_permission",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing"
markers = [
    "db: tests that require a Postgres database (deselect with -m 'not db')",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/migrations/*"]
